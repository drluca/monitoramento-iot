
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard IoT</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f7;
      margin: 0;
      padding: 25px;
      color: #1e293b;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    .cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      flex: 1;
      min-width: 200px;
      text-align: center;
      box-shadow: 0 3px 10px #0001;
    }

    .valor {
      font-size: 40px;
      font-weight: bold;
      color: #2563eb;
    }

    .grafico {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-top: 25px;
    }

    .status {
      text-align: center;
      color: #64748b;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>Monitoramento Ambiental IoT</h1>
    <p>Estação de monitoramento com ESP32</p>
  </header>

  <div class="status" id="status">
    Aguardando dados...
  </div>

  <div class="cards">

    <div class="card">
      <h3>Temperatura</h3>
      <div class="valor" id="temperatura">-- °C</div>
    </div>

    <div class="card">
      <h3>Umidade</h3>
      <div class="valor" id="umidade">-- %</div>
    </div>

  </div>

  <div class="grafico">
    <h3>Histórico de temperatura</h3>
    <canvas id="grafico"></canvas>
  </div>

</div>

<script>

  // CONFIGURAR GRÁFICO
  const grafico = new Chart(
    document.getElementById("grafico"),
    {
      type: "line",

      data: {
        labels: [],

        datasets: [{
          label: "Temperatura (°C)",
          data: [],
          borderWidth: 2,
          tension: 0.3
        }]
      },

      options: {
        responsive: true
      }
    }
  );

  // BUSCAR DADOS DO SERVIDOR
  async function atualizarDashboard() {

    try {

      const resposta = await fetch("/api/historico");

      const dados = await resposta.json();

      if (dados.length === 0) {
        return;
      }

      // ÚLTIMA LEITURA
      const atual = dados[dados.length - 1];

      // ATUALIZAR INDICADORES
      document.getElementById("temperatura")
        .innerText = atual.temperatura + " °C";

      document.getElementById("umidade")
        .innerText = atual.umidade + " %";

      document.getElementById("status")
        .innerText =
        "Dispositivo: " + atual.dispositivo +
        " | Atualizado: " +
        new Date(atual.horario).toLocaleTimeString();

      // ATUALIZAR GRÁFICO
      grafico.data.labels = dados.map(
        item => new Date(item.horario)
          .toLocaleTimeString()
      );

      grafico.data.datasets[0].data =
        dados.map(item => item.temperatura);

      grafico.update();

    } catch (erro) {

      document.getElementById("status")
        .innerText = "Erro ao receber dados do servidor.";

      console.log(erro);
    }
  }

  // ATUALIZAR A CADA 3 SEGUNDOS
  setInterval(atualizarDashboard, 3000);

  atualizarDashboard();

</script>

</body>
</html>
